name: zag_icons
description: >-
  Zag icon and illustration library for Flutter. Ships precompiled
  vector_graphics bytecode (.vg) for zero runtime XML parsing and small
  binaries. Generated artifacts are produced by scripts/generate-flutter.ts.
version: 0.1.0
homepage: https://example.com/zag
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  vector_graphics: ^1.1.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  vector_graphics_compiler: ^1.3.0
  path: ^1.9.0

flutter:
  assets:
    - assets/icons/outline/
    - assets/icons/filled/
    - assets/illustrations/
